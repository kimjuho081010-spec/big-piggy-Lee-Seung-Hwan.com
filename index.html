<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ AI 기반 실습실 전력 제어 및 위험 예측 시스템 ⚡</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: linear-gradient(135deg, #0d1117, #161b22);
      font-family: 'Segoe UI', Roboto, sans-serif; color: #c9d1d9; padding: 20px;
    }
    .container {
      width: min(950px, 94%); margin: 20px auto; background: #1f242c;
      border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); border: 1px solid #30363d;
    }
    h1 { margin: 0 0 10px; text-align: center; font-size: 28px; color: #58a6ff; text-shadow: 0 0 10px rgba(88, 166, 255, 0.2); }
    .subtitle { text-align: center; color: #8b949e; margin-bottom: 25px; font-size: 14px; }
    .auth-section {
      text-align: center; padding: 40px 20px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; margin-bottom: 25px;
    }
    .google-btn {
      background: #ffffff; color: #21262d; border: none; padding: 14px 28px; border-radius: 12px;
      font-size: 16px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s; margin: 0 auto;
    }
    .google-btn:hover { background: #f0f0f0; transform: translateY(-2px); }
    .g-icon {
      width: 20px; height: 20px; background: #4285F4; color: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 12px; font-family: sans-serif; font-weight: 900;
    }
    .user-info {
      display: flex; justify-content: space-between; align-items: center; background: #161b22;
      padding: 12px 20px; border-radius: 12px; margin-bottom: 25px; font-size: 14px; border: 1px solid #30363d;
    }
    .logout-btn { background: #f85149; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .dashboard-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 25px; margin-bottom: 25px; }
    @media (max-width: 850px) { .dashboard-grid { grid-template-columns: 1fr; } }
    .panel { background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 20px; }
    .panel-title { font-size: 15px; font-weight: bold; color: #58a6ff; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .status-display { text-align: center; padding: 15px; background: #0d1117; border-radius: 12px; margin-bottom: 15px; border: 1px solid #21262d; }
    .power-value { font-size: 38px; font-weight: bold; color: #39d353; margin: 8px 0; font-family: monospace; }
    .power-value.danger { color: #f85149; animation: blink 0.8s infinite; }
    @keyframes blink { 50% { opacity: 0.2; } }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
    select, textarea {
      width: 100%; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
      border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
    }
    textarea { min-height: 80px; resize: none; }
    .btn-block {
      width: 100%; background: #238636; color: white; border: none; border-radius: 8px;
      padding: 14px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.15s;
    }
    .btn-block:hover { background: #2ea44f; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; background: #0d1117; border: 1px solid #58a6ff; }
    .result-box.danger-box { border-color: #f85149; background: rgba(248, 81, 73, 0.05); }
    .tts-btn {
      background: #58a6ff; color: #0d1117; border: none; padding: 8px 16px; 
      border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 10px;
    }
    .log-container { max-height: 250px; overflow-y: auto; }
    .log-item {
      background: #0d1117; padding: 12px; border-radius: 8px; margin-bottom: 8px;
      font-size: 13px; border-left: 4px solid #39d353; border: 1px solid #21262d;
    }
    .log-item.trip { border-left: 4px solid #f85149; background: rgba(248, 81, 73, 0.03); }
    .status-text { text-align: center; font-size: 13px; color: #58a6ff; margin-top: 10px; min-height: 18px; }
    .hidden { display: none !important; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="container">
    <h1>⚡ AI 기반 실습실 전력 제어 및 위험 예측 시스템</h1>
    <div class="subtitle">[전기과 고3 전공융합] 생성형 AI 연동형 지능형 디지털 전력 계측소</div>

    <div id="loginSection" class="auth-section">
      <p style="margin-bottom: 20px; color: #c9d1d9; font-size: 14px; font-weight: bold;">
        🔓 원격 전력 시스템 제어를 위해 관리자 인증을 완료해 주세요.
      </p>
      <button class="google-btn" id="loginBtn">
        <div class="g-icon">G</div>
        구글 계정으로 시스템 기동
      </button>
    </div>

    <div id="mainSection" class="hidden">
      <div class="user-info">
        <span id="userDisplay" style="font-weight: bold; color: #58a6ff;">계통 관리자 연동 중...</span>
        <button class="logout-btn" id="logoutBtn">로그아웃</button>
      </div>

      <div class="dashboard-grid">
        <div class="panel">
          <div class="panel-title">⚙️ 실시간 계통 부하 모의 투입기</div>
          
          <div class="status-display">
            <div style="font-size: 12px; color: #8b949e;">현재 종합 연동 부하</div>
            <div id="totalPowerDisplay" class="power-value">0.00 kW</div>
            <div id="breakerStatus" style="font-size: 13px; font-weight: bold; color: #58a6ff;">메인 기기 상태: 정상 송전 중 (NORMAL)</div>
          </div>

          <div class="input-group">
            <label>🔌 가동할 전력 설비 선택</label>
            <select id="loadSelect">
              <option value="0">설비 선택 대기 (0.0 kW)</option>
              <option value="1.8">단상 유도전동기 구동 회로 (1.8 kW)</option>
              <option value="3.2">3상 동기 전동기 동력 제어반 (3.2 kW)</option>
              <option value="4.5">전기기기 실험용 고부하 저항기 (4.5 kW)</option>
              <option value="7.5">⚠️ 계통 차단(Trip) 유발용 임계 초과 전열기 (7.5 kW)</option>
            </select>
          </div>

          <div class="input-group">
            <label>📝 특이사항 및 부하 가동 목적 입력 (AI 분석 요청용)</label>
            <textarea id="textInput" placeholder="예: 전동기 가동 중 전압 강하 분석 및 역률 저하 의심됨."></textarea>
          </div>

          <button class="btn-block" id="insertLoadBtn">⚡ 부하 스위치 확정 및 AI 리포트 발행</button>
          <div id="statusText" class="status-text"></div>

          <div id="resultBox" class="result-box hidden">
            <div id="aiTitle" style="font-size: 14px; font-weight: bold; color: #58a6ff; margin-bottom: 6px;">🤖 생성형 AI 기술 진단 보고서</div>
            <div id="aiDiagnosisText" style="font-size: 13px; white-space: pre-wrap; line-height: 1.5; color: #e6edf3;"></div>
            <button class="tts-btn" id="speakBtn">🔊 AI 진단 내용 음성 청취 (TTS)</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel-title">📡 실시간 원격 보안 데이터베이스 (Firestore)</div>
          <div class="log-container" id="logContainer">데이터 동기화 대기 중...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAJINxHKNmsXaS8Pm7lGAb4rHAuSxpdaxY",
      authDomain: "big-piggy.firebaseapp.com",
      databaseURL: "https://big-piggy-default-rtdb.firebaseio.com",
      projectId: "big-piggy",
      storageBucket: "big-piggy.firebasestorage.app",
      messagingSenderId: "145569707083",
      appId: "1:145569707083:web:3c7af29c924e993afb89ce"
    };

    let auth, db;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) { console.log("초기화 체크 우회"); }

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7zQ0RJ32AmDdDQdJGfwWCD1tuKjF-A2VrF9jsgX6S6FCar4Dzl4fi1nYAzo225xjr/exec';
    const SYSTEM_MAX_POWER = 6.5; 

    const loginSection = document.getElementById('loginSection');
    const mainSection = document.getElementById('mainSection');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const userDisplay = document.getElementById('userDisplay');
    
    const totalPowerDisplay = document.getElementById('totalPowerDisplay');
    const breakerStatus = document.getElementById('breakerStatus');
    const loadSelect = document.getElementById('loadSelect');
    const textInput = document.getElementById('textInput');
    const insertLoadBtn = document.getElementById('insertLoadBtn');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const aiTitle = document.getElementById('aiTitle');
    const aiDiagnosisText = document.getElementById('aiDiagnosisText');
    const speakBtn = document.getElementById('speakBtn');
    const logContainer = document.getElementById('logContainer');

    let currentUser = null;
    let currentPower = 0;
    let lastAiText = ""; 

    if (auth) {
      loginBtn.addEventListener('click', () => {
        auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => alert("로그인 오류: " + err.message));
      });
      logoutBtn.addEventListener('click', () => auth.signOut());
      auth.onAuthStateChanged((user) => {
        if (user) {
          currentUser = user;
          loginSection.classList.add('hidden');
          mainSection.classList.remove('hidden');
          userDisplay.textContent = `계통 관리자: ${user.displayName || '요원'} (${user.email})`;
          loadLogs();
        } else {
          currentUser = null;
          loginSection.classList.remove('hidden');
          mainSection.classList.add('hidden');
        }
      });
    }

    loadSelect.addEventListener('change', () => {
      const loadVal = Number(loadSelect.value);
      currentPower = loadVal;
      let isTrip = currentPower > SYSTEM_MAX_POWER;
      totalPowerDisplay.textContent = `${currentPower.toFixed(2)} kW / ${SYSTEM_MAX_POWER} kW`;
      
      if (isTrip) {
        totalPowerDisplay.className = "power-value danger";
        breakerStatus.innerHTML = `<span style="color:#f85149;">🚨 [EMERGENCY TRIP] 메인 차단기 강제 차단됨!</span>`;
        resultBox.className = "result-box danger-box";
        aiTitle.style.color = "#f85149";
        aiTitle.textContent = "🚨 시스템 긴급 차단 알림 (차단기 해제)";
        lastAiText = `경고합니다. 현재 전력 사용량이 ${currentPower} 킬로와트로 허용 한계치인 6.5 킬로와트를 완전히 초과했습니다. 화재 및 선로 소손 위험이 있어 메인 차단기가 즉시 차단되었습니다. 안전을 위해 전열기 부하를 즉시 분리하십시오.`;
        aiDiagnosisText.textContent = lastAiText;
        resultBox.classList.remove('hidden');
        playTTS(lastAiText);
        insertLoadBtn.disabled = true;
      } else {
        totalPowerDisplay.className = "power-value";
        breakerStatus.innerHTML = `<span style="color:#58a6ff;">메인 기기 상태: 정상 송전 중 (NORMAL)</span>`;
        resultBox.className = "result-box";
        aiTitle.style.color = "#58a6ff";
        aiTitle.textContent = "🤖 생성형 AI 기술 진단 보고서";
        resultBox.classList.add('hidden');
        insertLoadBtn.disabled = false;
      }
    });

    insertLoadBtn.addEventListener('click', async () => {
      const userNotes = textInput.value.trim() || "특이사항 없음";
      statusText.textContent = "생성형 AI 모델 기반 계통 데이터 정밀 분석 중...";
      const localBackupReport = `전력 설비 정밀 분석 결과입니다. 현재 계통 부하는 ${currentPower} 킬로와트이며, 접수된 관리자 메모는 [${userNotes}] 입니다. 안전 진단 결과 현재 선로는 정상 범주 안에서 제어되고 있습니다.`;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            type: 'ai_analysis', 
            power: currentPower, 
            text: userNotes 
          })
        });
        const data = await response.json();
        lastAiText = data.aiText || localBackupReport;
      } catch (e) {
        lastAiText = localBackupReport;
      }

      aiDiagnosisText.textContent = lastAiText;
      resultBox.classList.remove('hidden');
      statusText.textContent = "⚡ 생성형 AI 정밀 리포트 분석 완료 및 원격 DB 기록 완료";
      playTTS(lastAiText);

      if (db && currentUser) {
        try {
          await db.collection("power_ai_logs").add({
            email: currentUser.email,
            name: currentUser.displayName || "관리자",
            addedEquipment: loadSelect.options[loadSelect.selectedIndex].text,
            totalPowerkW: currentPower,
            aiReport: lastAiText,
            isSystemTrip: currentPower > SYSTEM_MAX_POWER,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          loadLogs();
        } catch (dbErr) { console.error(dbErr); }
      }
    });

    speakBtn.addEventListener('click', () => { if (lastAiText) playTTS(lastAiText); });

    function playTTS(msg) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); 
        const cleanMsg = msg.replace(/[\[\]]/g, '').replace(/kW/gi, '킬로와트');
        const utterance = new SpeechSynthesisUtterance(cleanMsg);
        utterance.lang = "ko-KR";
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function loadLogs() {
      if (!db) return;
      db.collection("power_ai_logs").orderBy("timestamp", "desc").limit(3).get().then((snapshot) => {
        logContainer.innerHTML = "";
        if (snapshot.empty) {
          logContainer.innerHTML = "<div style='color:#8b949e;text-align:center;'>수집된 데이터 로그가 없습니다.</div>";
          return;
        }
        snapshot.forEach((doc) => {
          const data = doc.data();
          const div = document.createElement('div');
          div.className = `log-item ${data.isSystemTrip ? 'trip' : ''}`;
          div.innerHTML = `
            <div style="font-size:11px; color:#8b949e; margin-bottom:4px;">🔋 관리자: ${data.name}</div>
            <div><strong>합산전력:</strong> ${data.totalPowerkW} kW [${data.isSystemTrip ? '💥 TRIP' : '정상'}]</div>
            <div style="font-size:11px; color:#8b949e; margin-top:4px; border-top:1px dashed #30363d; padding-top:4px;">AI요약: ${data.aiReport.substring(0, 45)}...</div>
          `;
          logContainer.appendChild(div);
        });
      }).catch(() => { logContainer.innerHTML = "동기화 연결 중..."; });
    }
  </script>
</body>
</html>
